name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./... && go vet -tags integration ./...
      - name: unit tests
        run: go test -race ./...

  integration:
    name: integration (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: integration tests
        run: go test -tags integration -v ./internal/repro/

  release-check:
    name: release build and installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: snapshot release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=before
      - name: shellcheck install.sh
        run: shellcheck -s sh scripts/install.sh
      - name: install from the snapshot
        run: |
          archive=$(ls dist/failtrace_*_linux_amd64.tar.gz)
          version=$(basename "$archive" | sed -E 's/^failtrace_(.*)_linux_amd64\.tar\.gz$/\1/')
          mkdir -p "release/v$version"
          cp dist/*.tar.gz dist/checksums.txt "release/v$version/"
          FAILTRACE_BASE_URL="file://$PWD/release" FAILTRACE_VERSION="$version" FAILTRACE_INSTALL_DIR="$RUNNER_TEMP/bin" \
            sh scripts/install.sh
          "$RUNNER_TEMP/bin/failtrace" version
